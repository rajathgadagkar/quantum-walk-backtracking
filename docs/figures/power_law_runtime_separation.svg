  <text x="460" y="54" text-anchor="middle" fill="#94a3b8" font-size="12">For Pr[T = t] ~ t^beta with -2 < beta < -3/2, E[T] grows exponentially in log2(M) while E[sqrt(T)] converges to O(1)</text>
